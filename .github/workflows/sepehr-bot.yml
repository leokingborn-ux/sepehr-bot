# Sepehr demo bot — runs on GitHub Actions, polling mode, under the supervisor.
#
# This repo lives on a SECONDARY GitHub account on purpose: if GitHub ever
# objects to running a bot on Actions, only this account is affected — the
# main account (portfolio + Pages demos) is untouched.
#
# How it works: every 6 hours a run starts run_bot.py, which supervises
# bot.py with exponential-backoff restarts (60s → 120s → 240s → 480s → 900s
# cap; reset after a healthy 10-minute run; gives up after 5 fast crashes in
# a row, which means a config/token problem, not a transient failure). The
# run ends cleanly after ~340 minutes, ~10 minutes before the next scheduled
# run — that gap is the cooldown, so no two runs ever overlap (two polling
# instances would fight over Telegram updates). If the bot crashes, the
# supervisor restarts it; if the run ends, the next cron picks it up.
# Telegram queues messages while the bot is down, so nothing is lost.
#
# The user-side "down" notice is inside the bot itself: the /start welcome
# text and /status say the bot rests for a few minutes every 6 hours and
# comes back. A bot that is down cannot send a message, so the notice has to
# be written in the bot before it goes down — that is how it is done here.
# (Also set the bot's profile description in BotFather to the same line.)
#
# Setup (once, in this repo on GitHub):
#   Settings → Secrets and variables → Actions → New repository secret
#     Name: BOT_TOKEN  Value: the bot token from BotFather (never commit it)
#     Name: ADMIN_USER_ID (optional)  Value: the admin's Telegram user id
#
# Honest note: GitHub Actions is built for CI/CD, not for hosting a bot.
# This stays inside the free tier (4 runs/day × ~6h, and the bot itself uses
# almost no CPU), so a flag is unlikely — but it is not what Actions is for.
# That is why it runs here, on a secondary account, away from the portfolio.

name: Sepehr bot

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours, at :00 UTC
  workflow_dispatch: # manual run, from the Actions tab

permissions:
  contents: read

concurrency:
  group: sepehr-bot
  cancel-in-progress: false # never kill a running bot to start another one

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # backstop; the supervisor stops cleanly at ~340 min
    env:
      PYTHONUNBUFFERED: "1"
      BOT_MODE: polling
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot under the supervisor
        run: python run_bot.py
